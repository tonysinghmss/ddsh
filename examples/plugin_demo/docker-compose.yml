services:
  postgres:
    image: postgres:16-alpine
    container_name: ddsh-plugin-postgres
    environment:
      POSTGRES_DB: ddsh
      POSTGRES_USER: ddsh
      POSTGRES_PASSWORD: ddsh
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddsh -d ddsh"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - ddsh-plugin-postgres-data:/var/lib/postgresql/data

volumes:
  ddsh-plugin-postgres-data:
